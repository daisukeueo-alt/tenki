<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1時間ごとの天気</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="天気">
<meta name="theme-color" content="#1f6fd1">
<style>
:root{--bg:#f3f6fa;--card:#fff;--fg:#17202b;--sub:#5a6877;--line:#dde4ec;--accent:#1f6fd1;--rain:#1f6fd1}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212b;--fg:#e8eef5;--sub:#93a1b1;--line:#2a3441;--accent:#5aa2f5;--rain:#5aa2f5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
main{max-width:680px;margin:0 auto}
h1{font-size:1.1rem;margin:0 0 10px}
button,input{font:inherit;color:var(--fg)}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;min-width:0}
.pc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pc .n{font-size:.8rem;color:var(--sub)}
.pc .i{font-size:1.6rem;line-height:1.2}
.pc .t{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.pc .s{font-size:.75rem;color:var(--sub);font-variant-numeric:tabular-nums}
.sub{color:var(--sub);font-size:.9rem;margin:0 0 8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
form{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.set{margin-bottom:12px}
.cols,.row{display:grid;grid-template-columns:3rem 1.8rem 1fr 3rem 3rem 3.8rem;gap:6px;align-items:center}
.cols{color:var(--sub);font-size:.72rem;padding:0 12px 4px}
.cols span:nth-child(n+4),.row .p,.row .tp,.row .pa{text-align:right}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{padding:10px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.row.day{display:block;background:var(--bg);color:var(--sub);font-size:.85rem;padding:6px 12px;border-top:0}
.row .h{font-weight:600}
.row .w{color:var(--sub);font-size:.8rem;min-width:0}
.row .p{color:var(--rain)}
.row .tp{font-weight:600}
.row .pa{color:var(--sub);font-size:.85rem}
.row.rainy{background:color-mix(in srgb,var(--rain) 8%,var(--card))}
.cand{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.cb{text-align:left}
h2{font-size:.95rem;margin:16px 0 8px}
.wrow{display:grid;grid-template-columns:4.6rem 1.8rem 1fr 3rem 6.6rem;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.wrow:first-child{border-top:0}
.wrow .d{font-weight:600}
.wrow .w{color:var(--sub);font-size:.85rem;min-width:0}
.wrow .p{color:var(--rain);text-align:right}
.wrow .mm{text-align:right;font-weight:600;white-space:nowrap}
.wrow .d{white-space:nowrap}
.wrow .mm i{font-style:normal;color:var(--sub);font-weight:400}
.wrow.rainy{background:color-mix(in srgb,var(--rain) 8%,var(--card))}
.msg{color:var(--sub);padding:16px;text-align:center}
.foot{color:var(--sub);font-size:.8rem;margin-top:12px}
</style>
</head>
<body>
<main>
  <h1>1時間ごとの天気</h1>
  <div class="cards" id="cards"></div>
  <p class="sub" id="place"></p>
  <div class="bar" role="group" aria-label="表示の間隔">
    <button type="button" id="b1" aria-pressed="true">1時間ごと</button>
    <button type="button" id="b3" aria-pressed="false">3時間ごと</button>
    <button type="button" id="bw" aria-pressed="false">週間</button>
    <button type="button" id="bgps">現在地を更新</button>
    <button type="button" id="inst" hidden>アプリとして入れる</button>
  </div>
  <p class="sub" id="iosHint" hidden>iPhoneでアプリにするには、Safariの下の共有ボタン →「ホーム画面に追加」を押してください。</p>
  <div id="setbox" class="set" hidden>
    <p class="sub" id="settext"></p>
    <div class="bar">
      <button type="button" id="setgps">いまいる場所を登録</button>
    </div>
    <form id="f">
      <input id="q" type="search" placeholder="住所か地名（例：広島県呉市郷原町）" aria-label="地名">
      <button type="submit">登録</button>
    </form>
    <div id="cand" class="cand"></div>
  </div>
  <div id="weekbox" hidden><h2>週間天気</h2><div class="list" id="week"></div></div>
  <div id="hourbox"><h2 id="hh">1時間ごとの天気</h2>
  <div class="cols" aria-hidden="true"><span>時刻</span><span></span><span>天気</span><span>降水確率</span><span>気温</span><span>気圧</span></div>
  <div class="list" id="list"><div class="msg">読み込み中…</div></div>
  </div>
  <p class="foot">データ：Open-Meteo（無料・登録不要）。家と仕事場の場所は、この端末のブラウザにだけ保存されます。</p>
</main>
<script>
(function(){
  var DEF={name:"呉市",lat:34.2490,lon:132.5656};
  var NAMES={gps:"現在地",home:"家",work:"仕事場"};
  var KEYS=["gps","home","work"];
  var step=1,sel="gps",view="h1";
  var pl={gps:null,home:null,work:null};
  var dt={gps:null,home:null,work:null};
  var gpsFail=false;
  var $=function(i){return document.getElementById(i)};
  var WC={0:["☀️","快晴"],1:["🌤️","晴れ"],2:["⛅","薄曇り"],3:["☁️","曇り"],45:["🌫️","霧"],48:["🌫️","霧"],
    51:["🌦️","霧雨"],53:["🌦️","霧雨"],55:["🌧️","強い霧雨"],56:["🌧️","凍る霧雨"],57:["🌧️","凍る霧雨"],
    61:["🌧️","小雨"],63:["🌧️","雨"],65:["🌧️","強い雨"],66:["🌧️","凍る雨"],67:["🌧️","凍る雨"],
    71:["🌨️","小雪"],73:["🌨️","雪"],75:["❄️","大雪"],77:["🌨️","雪あられ"],
    80:["🌦️","にわか雨"],81:["🌧️","にわか雨"],82:["⛈️","激しい雨"],85:["🌨️","にわか雪"],86:["🌨️","にわか雪"],
    95:["⛈️","雷雨"],96:["⛈️","雷雨・ひょう"],99:["⛈️","雷雨・ひょう"]};
  function wc(c){return WC[c]||["❔","不明"]}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

  function save(){try{localStorage.setItem("tenki_places",JSON.stringify({home:pl.home,work:pl.work}))}catch(e){}}
  function restore(){try{var s=JSON.parse(localStorage.getItem("tenki_places")||"{}");if(s.home)pl.home=s.home;if(s.work)pl.work=s.work}catch(e){}}

  function cacheSave(k,p,j){try{localStorage.setItem("tenki_cache_"+k,JSON.stringify({p:p,j:j,t:Date.now()}))}catch(e){}}
  function cacheLoad(k){try{var c=JSON.parse(localStorage.getItem("tenki_cache_"+k)||"null");if(c&&c.j&&c.p&&Date.now()-c.t<6*3600*1000){if(!pl[k])pl[k]=c.p;dt[k]=c.j}}catch(e){}}
  function fetchPlace(k){
    var p=pl[k];if(!p){dt[k]=null;renderAll();return}
    var u="https://api.open-meteo.com/v1/forecast?latitude="+p.lat+"&longitude="+p.lon+
      "&current=temperature_2m,weather_code,pressure_msl&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,pressure_msl"+
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
      "&timezone=Asia%2FTokyo&forecast_days=7&wind_speed_unit=ms";
    dt[k]="loading";renderAll();
    fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
      .then(function(j){dt[k]=j;cacheSave(k,p,j);renderAll()})
      .catch(function(){dt[k]="error";renderAll()});
  }

  function renderCards(){
    var box=$("cards");box.textContent="";
    KEYS.forEach(function(k){
      var b=el("button","pc");b.type="button";b.setAttribute("aria-pressed",k===sel?"true":"false");
      b.appendChild(el("div","n",NAMES[k]+(pl[k]&&k!=="gps"?"：":"")+(pl[k]&&k!=="gps"?pl[k].name:"")));
      var d=dt[k];
      if(d&&d!=="loading"&&d!=="error"&&d.current){
        var w=wc(d.current.weather_code);
        b.appendChild(el("div","i",w[0]));
        b.appendChild(el("div","t",Math.round(d.current.temperature_2m)+"℃"));
        if(d.daily&&d.daily.temperature_2m_max)b.appendChild(el("div","s","最高"+Math.round(d.daily.temperature_2m_max[0])+"/最低"+Math.round(d.daily.temperature_2m_min[0])));
        b.appendChild(el("div","s",Math.round(d.current.pressure_msl)+" hPa"));
      }else{
        var m=!pl[k]?(k==="gps"?(gpsFail?"位置不明":"調べ中…"):"未登録"):d==="error"?"取得失敗":"読込中…";
        b.appendChild(el("div","s",m));
      }
      b.onclick=function(){sel=k;renderAll()};
      box.appendChild(b);
    });
  }

  function renderList(){
    var list=$("list");list.textContent="";
    var p=pl[sel],d=dt[sel];
    $("setbox").hidden=(sel==="gps"||!!p&&false);
    if(sel!=="gps"){
      $("setbox").hidden=false;
      $("settext").textContent=p?NAMES[sel]+"は「"+p.name+"」です。変えるときは、下で登録し直してください。":NAMES[sel]+"の場所を登録してください。";
    }
    $("place").textContent=p?NAMES[sel]+"："+p.name+"（緯度 "+p.lat.toFixed(3)+" / 経度 "+p.lon.toFixed(3)+"）":NAMES[sel]+"：まだ場所がありません";
    if(!p){list.appendChild(el("div","msg",sel==="gps"?"位置情報を取得できません。「現在地を更新」を押すか、位置情報を許可してください。":"上で「いまいる場所を登録」か、地名で登録すると、天気が出ます。"));return}
    if(d==="loading"||!d){list.appendChild(el("div","msg","読み込み中…"));return}
    if(d==="error"){list.appendChild(el("div","msg","天気を取得できませんでした。通信を確認して、もう一度お試しください。"));return}
    var h=d.hourly,now=new Date(),pad=function(n){return String(n).padStart(2,"0")};
    var nowStr=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate())+"T"+pad(now.getHours())+":00";
    var start=h.time.indexOf(nowStr);if(start<0)start=0;
    var lastDay="",count=0,k=0,max=step===1?36:16;
    for(var i=start;i<h.time.length&&count<max;i++){
      if(k%step!==0){k++;continue}k++;
      var t=h.time[i],day=t.slice(5,10).replace("-","/");
      if(day!==lastDay){var wd=["日","月","火","水","木","金","土"][new Date(t).getDay()];
        list.appendChild(el("div","row day",day+"（"+wd+"）"));lastDay=day}
      var w2=wc(h.weather_code[i]),pp=h.precipitation_probability[i],pr=h.precipitation[i],ps=h.pressure_msl[i];
      var row=el("div","row"+((pp>=50||pr>=1)?" rainy":""));
      row.appendChild(el("span","h",t.slice(11,13)+"時"));
      row.appendChild(el("span",null,w2[0]));
      row.appendChild(el("span","w",w2[1]+(pr>0?"・"+pr+"mm":"")+"・風"+Math.round(h.wind_speed_10m[i])+"m/s"));
      row.appendChild(el("span","p",pp==null?"-":pp+"%"));
      row.appendChild(el("span","tp",Math.round(h.temperature_2m[i])+"℃"));
      row.appendChild(el("span","pa",ps==null?"-":Math.round(ps)+"hPa"));
      list.appendChild(row);count++;
    }
  }
  function renderWeek(){
    var box=$("week");box.textContent="";
    var d=dt[sel];
    if(!d||d==="loading"||d==="error"||!d.daily){box.appendChild(el("div","msg","—"));return}
    var y=d.daily,days=["日","月","火","水","木","金","土"];
    for(var i=0;i<y.time.length;i++){
      var t=y.time[i],w=wc(y.weather_code[i]),pp=y.precipitation_probability_max[i];
      var r=el("div","wrow"+(pp>=50?" rainy":""));
      var dd=new Date(t+"T00:00:00");
      r.appendChild(el("span","d",i===0?"今日":(dd.getMonth()+1)+"/"+dd.getDate()+"("+days[dd.getDay()]+")"));
      r.appendChild(el("span",null,w[0]));
      r.appendChild(el("span","w",w[1]));
      r.appendChild(el("span","p",pp==null?"-":pp+"%"));
      var m=el("span","mm",Math.round(y.temperature_2m_max[i])+"℃");
      m.appendChild(el("i",null," / "+Math.round(y.temperature_2m_min[i])+"℃"));
      r.appendChild(m);box.appendChild(r);
    }
  }
  function renderAll(){renderCards();renderWeek();renderList()}

  function gps(){
    gpsFail=false;renderAll();
    if(!navigator.geolocation){gpsFail=true;renderAll();return}
    navigator.geolocation.getCurrentPosition(function(pos){
      pl.gps={name:"現在地",lat:pos.coords.latitude,lon:pos.coords.longitude};fetchPlace("gps");
    },function(){gpsFail=true;renderAll()},{enableHighAccuracy:false,timeout:10000,maximumAge:600000});
  }

  function register(k,p){pl[k]=p;save();fetchPlace(k)}

  function setView(v){
    view=v;step=(v==="h3"?3:1);
    $("b1").setAttribute("aria-pressed",v==="h1"?"true":"false");
    $("b3").setAttribute("aria-pressed",v==="h3"?"true":"false");
    $("bw").setAttribute("aria-pressed",v==="wk"?"true":"false");
    $("weekbox").hidden=(v!=="wk");$("hourbox").hidden=(v==="wk");
    $("hh").textContent=(v==="h3"?"3時間ごとの天気":"1時間ごとの天気");
    try{localStorage.setItem("tenki_view",v)}catch(e){}
    renderList();
  }
  $("b1").onclick=function(){setView("h1")};
  $("b3").onclick=function(){setView("h3")};
  $("bw").onclick=function(){setView("wk")};
  $("bgps").onclick=gps;
  $("setgps").onclick=function(){
    if(!navigator.geolocation){$("settext").textContent="この端末では位置情報を使えません。地名で登録してください。";return}
    navigator.geolocation.getCurrentPosition(function(pos){
      register(sel,{name:"登録した場所",lat:pos.coords.latitude,lon:pos.coords.longitude});
    },function(){$("settext").textContent="位置情報が許可されていません。地名で登録してください。"},{timeout:10000});
  };
  function setMsg(s){$("settext").textContent=s}
  function done(p){
    $("cand").textContent="";$("q").value="";
    register(sel,p);setMsg("「"+p.name+"」を"+NAMES[sel]+"に登録しました。");
  }
  function showCands(list){
    var box=$("cand");box.textContent="";
    setMsg("当てはまる場所が"+list.length+"件あります。選んでください。");
    list.forEach(function(p){
      var b=el("button","cb",p.name);b.type="button";
      b.onclick=function(){done(p)};box.appendChild(b);
    });
  }
  function geocodeOM(q){
    return fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=5&language=ja")
      .then(function(r){return r.json()}).then(function(j){
        return (j.results||[]).map(function(r){return {name:r.name+(r.admin1?"（"+r.admin1+"）":""),lat:r.latitude,lon:r.longitude}});
      });
  }
  function geocodeGSI(q){
    return fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q))
      .then(function(r){return r.json()}).then(function(a){
        return (a||[]).slice(0,5).map(function(f){return {name:f.properties.title,lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]}});
      });
  }
  $("f").addEventListener("submit",function(ev){
    ev.preventDefault();var q=$("q").value.trim();if(!q){setMsg("住所か地名を入れてください。");return}
    $("cand").textContent="";setMsg("探しています…");
    geocodeGSI(q).catch(function(){return []}).then(function(list){
      if(list.length)return list;
      return geocodeOM(q).catch(function(){return []});
    }).then(function(list){
      if(!list.length){setMsg("「"+q+"」が見つかりませんでした。「広島県呉市郷原町」のように、県・市・町の順で入れてみてください（番地や建物名は外します）。");return}
      if(list.length===1)done(list[0]);else showCands(list);
    });
  });

  var dp=null;
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;$("inst").hidden=false});
  $("inst").onclick=function(){if(!dp)return;dp.prompt();dp.userChoice.finally(function(){dp=null;$("inst").hidden=true})};
  var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
  var ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  if(ios&&!standalone)$("iosHint").hidden=false;
  if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){})}
  var lastRef=Date.now();
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"&&Date.now()-lastRef>10*60*1000){lastRef=Date.now();gps();["home","work"].forEach(function(k){if(pl[k])fetchPlace(k)})}
  });
  restore();KEYS.forEach(cacheLoad);renderAll();
  try{var sv=localStorage.getItem("tenki_view");if(sv==="h1"||sv==="h3"||sv==="wk")setView(sv)}catch(e){}gps();fetchPlace("home");fetchPlace("work");
  setInterval(function(){KEYS.forEach(function(k){if(pl[k])fetchPlace(k)})},1800000);
})();
</script>
</body>
</html>
